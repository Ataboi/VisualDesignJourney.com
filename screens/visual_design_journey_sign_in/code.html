<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Visual Design Journey</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Manrope:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#faf8ff",
                        "inverse-primary": "#c5c0ff",
                        "surface": "#faf8ff",
                        "surface-dim": "#d2d9f4",
                        "secondary-fixed": "#e1e3e4",
                        "primary-container": "#7067cc",
                        "tertiary-fixed": "#ffdf98",
                        "surface-container-low": "#f2f3ff",
                        "on-tertiary-fixed-variant": "#5a4300",
                        "outline": "#787583",
                        "secondary-container": "#e1e3e4",
                        "error-container": "#ffdad6",
                        "surface-container": "#eaedff",
                        "accent-soft-purple": "#7F77DD",
                        "on-primary-fixed": "#140067",
                        "primary-fixed": "#e4dfff",
                        "on-primary-container": "#fffbff",
                        "surface-container-highest": "#dae2fd",
                        "on-secondary-container": "#626566",
                        "secondary-fixed-dim": "#c5c7c8",
                        "error": "#ba1a1a",
                        "surface-tint": "#5951b4",
                        "on-primary-fixed-variant": "#41379b",
                        "on-background": "#131b2e",
                        "on-tertiary-container": "#fffbff",
                        "surface-variant": "#dae2fd",
                        "on-secondary": "#ffffff",
                        "on-surface-variant": "#474552",
                        "border-subtle": "#E9ECEF",
                        "secondary": "#5c5f60",
                        "on-secondary-fixed-variant": "#454748",
                        "primary": "#574eb1",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#745800",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#efc04c",
                        "surface-container-high": "#e2e7ff",
                        "tertiary-container": "#926f00",
                        "inverse-surface": "#283044",
                        "on-secondary-fixed": "#191c1d",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#131b2e",
                        "on-tertiary-fixed": "#251a00",
                        "inverse-on-surface": "#eef0ff",
                        "on-error": "#ffffff",
                        "outline-variant": "#c8c4d4",
                        "text-muted": "#454F5E",
                        "surface-white": "#FFFFFF",
                        "background": "#F8F8F8", /* Applied specific requested background */
                        "primary-fixed-dim": "#c5c0ff",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "container-max": "1440px",
                        "margin-desktop": "48px",
                        "section-gap": "80px",
                        "margin-tablet": "32px"
                    },
                    "fontFamily": {
                        "headline-xl": ["Manrope"],
                        "label-caps": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Manrope"],
                        "headline-xl-mobile": ["Manrope"],
                        "display-lg": ["Manrope"],
                        "caption": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-xl": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "headline-xl-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "display-lg": ["64px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "caption": ["13px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-tablet font-body-md text-body-md text-on-surface">
<!-- Main Container -->
<main class="w-full max-w-[480px] flex flex-col items-center">
<!-- Brand / Header -->
<div class="mb-12 text-center w-full">
<h1 class="font-headline-md text-headline-md font-semibold text-on-surface mb-2 tracking-tight">Visual Design Journey</h1>
<p class="font-body-md text-body-md text-text-muted">Welcome back to the gallery.</p>
</div>
<!-- Login Card -->
<div class="w-full bg-surface-white border-[0.5px] border-border-subtle rounded-lg p-8 md:p-10 mb-8 flex flex-col gap-6">
<form class="flex flex-col gap-5 w-full">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface uppercase" for="email">Email Address</label>
<input class="w-full px-4 py-3 border-[0.5px] border-border-subtle rounded-md bg-surface-white text-on-surface font-body-md text-body-md placeholder:text-text-muted/50 focus:outline-none focus:border-accent-soft-purple focus:ring-1 focus:ring-accent-soft-purple transition-colors" id="email" name="email" placeholder="name@example.com" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center w-full">
<label class="font-label-caps text-label-caps text-on-surface uppercase" for="password">Password</label>
<a class="font-caption text-caption text-text-muted hover:text-accent-soft-purple transition-colors" href="#">Forgot password?</a>
</div>
<input class="w-full px-4 py-3 border-[0.5px] border-border-subtle rounded-md bg-surface-white text-on-surface font-body-md text-body-md placeholder:text-text-muted/50 focus:outline-none focus:border-accent-soft-purple focus:ring-1 focus:ring-accent-soft-purple transition-colors" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<!-- Primary Action -->
<button class="w-full mt-2 bg-accent-soft-purple text-surface-white rounded-full py-3 px-6 font-body-md text-body-md font-medium hover:opacity-80 transition-opacity" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 w-full my-2">
<div class="h-[0.5px] bg-border-subtle flex-1"></div>
<span class="font-caption text-caption text-text-muted uppercase tracking-wider">Or</span>
<div class="h-[0.5px] bg-border-subtle flex-1"></div>
</div>
<!-- Secondary Action -->
<button class="w-full bg-transparent border-[0.5px] border-border-subtle text-on-surface rounded-full py-3 px-6 font-body-md text-body-md font-medium hover:bg-surface-bright transition-colors flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">account_circle</span>
                Continue with Google
            </button>
</div>
<!-- Footer Link -->
<p class="font-caption text-caption text-text-muted text-center">
            Don't have an account? 
            <a class="text-accent-soft-purple hover:text-on-surface transition-colors font-medium ml-1" href="#">Register now</a>
</p>
</main>
</body></html>
