<button class="absolute top-2 right-2 w-8 h-8 bg-surface-white/90 backdrop-blur rounded-full flex items-center justify-center text-error opacity-0 group-hover:opacity-100 transition-opacity hover:bg-surface-white">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>

<!-- Title -->
<div>

</div>
<!-- Tags -->
<div>
<label class="block font-label-caps text-label-caps text-text-muted mb-2">Tags</label>

<span class="inline-flex items-center bg-[#F8F9FA] px-3 py-1.5 rounded-full font-label-caps text-label-caps text-on-surface border border-border-subtle">

<span class="material-symbols-outlined text-[14px]">close</span>

<span class="material-symbols-outlined text-[14px]">close</span>

</span>

<span class="material-symbols-outlined text-[14px]">close</span>
</button>
</span>
</div>
<input class="w-full bg-transparent border border-border-subtle rounded-md px-4 py-3 font-body-md text-body-md focus:outline-none focus:border-accent-soft-purple transition-colors text-on-surface" placeholder="Add a tag..." type="text"/>
</div>
<!-- Actions -->
<div class="pt-8 border-t border-border-subtle flex flex-col sm:flex-row items-center justify-between gap-4">
<div class="flex items-center gap-4 w-full sm:w-auto order-2 sm:order-1">
<button class="px-6 py-3 rounded-full border border-border-subtle text-on-surface font-label-caps text-label-caps hover:bg-[#F8F9FA] transition-colors w-full sm:w-auto" type="button">

<button class="px-6 py-3 rounded-full bg-accent-soft-purple text-surface-white font-label-caps text-label-caps hover:opacity-90 transition-opacity w-full sm:w-auto" type="submit">
                                    Save Changes

</div>
<button class="px-6 py-3 rounded-full border border-error text-error font-label-caps text-label-caps hover:bg-error-container/30 transition-colors w-full sm:w-auto order-1 sm:order-2" type="button">
